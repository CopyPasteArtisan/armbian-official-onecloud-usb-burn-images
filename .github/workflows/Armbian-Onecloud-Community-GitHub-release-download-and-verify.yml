name: Armbian-Onecloud-verify-official-image

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Armbian img.xz 下载链接'
        required: true
        default: 'https://github.com/armbian/community/releases/download/26.2.0-trunk.904/Armbian_community_26.2.0-trunk.904_Onecloud_trixie_current_6.12.28_minimal.img.xz'

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: hzyitc/u-boot
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  UBOOT_TAG: build-20221028-0940

permissions:
  contents: write

jobs:
  build:
    name: Build burn.img
    runs-on: ubuntu-22.04

    steps:
      - name: Install Dependents
        run: |
          TIME="$(curl https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID} | jq -r .created_at)"
          TAG="CI-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
          echo "TAG=$TAG" >> $GITHUB_ENV
          
          sudo apt-get update
          sudo apt-get install img2simg

          ver="v0.3.1"
          echo "https://github.com/hzyitc/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64"
          curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg

      - name: Download and decompress Official Armbian Image
        run: |
          set -euo pipefail
          echo "::group::下载镜像..."
          IMAGE_URL="${{ github.event.inputs.image_url }}"
          echo "下载链接: $IMAGE_URL"

          # 下载镜像
          curl -L -O "$IMAGE_URL"
          imgfile=$(basename "$IMAGE_URL")
          echo "downloaded: $imgfile"

          # 计算本地 SHA256
          local_sha256=$(sha256sum "$imgfile" | awk '{print $1}')
          echo "Local SHA256: $local_sha256"
          echo "$local_sha256  $imgfile" | tee sha256sum

          # 方案1: 尝试从原始 URL 位置下载 .sha 文件
          sha_url="${IMAGE_URL}.sha"
          echo ""
          echo "尝试方案1: 下载 SHA 文件 ($sha_url)"
          if curl -fsSL -o image.sha "$sha_url" 2>/dev/null; then
            echo "SHA 文件下载成功"
            expected_hash=$(awk '{print $1}' image.sha)
            echo "Expected: $expected_hash"
            echo "Actual:   $local_sha256"
            if [ "$expected_hash" = "$local_sha256" ]; then
              echo "SHA256 verified OK!"
              echo "::endgroup::"
              echo "镜像验证成功，跳过其他验证方法"
              xz_check_passed="true"
            else
              echo "SHA256 mismatch!"
              cat image.sha
              exit 1
            fi
          else
            echo "SHA 文件不可用，尝试其他方法..."
          fi

          # 方案2: 从 GitHub Release API 查询对应的 checksum 文件
          if [[ "$IMAGE_URL" =~ github.com/.*releases/download ]]; then
            echo ""
            echo "尝试方案2: 从 GitHub Release API 获取对应的 checksum 文件"
            
            # 提取仓库、tag 和文件名信息
            REPO=$(echo "$IMAGE_URL" | grep -oP 'github\.com/\K[^/]+/[^/]+' || echo "")
            TAG=$(echo "$IMAGE_URL" | grep -oP '(?<=releases/download/)[^/]+' || echo "")
            FILENAME=$(basename "$IMAGE_URL")
            
            if [ -n "$REPO" ] && [ -n "$TAG" ]; then
              echo "Repository: $REPO"
              echo "Release Tag: $TAG"
              echo "Image File: $FILENAME"
              
              # 查询 Release API - 获取所有 assets
              echo "https://api.github.com/repos/$REPO/releases/tags/$TAG"
              RELEASE_JSON=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG")
              
              # 方法 A: 查找匹配的 .sha 文件（{原文件名}.sha）
              CHECKSUM_FILE="${FILENAME}.sha"
              echo "查找对应的 checksum 文件: $CHECKSUM_FILE"
              
              CHECKSUM_URL=$(echo "$RELEASE_JSON" | jq -r ".assets[] | select(.name == \"$CHECKSUM_FILE\") | .browser_download_url" | head -1)
              
              if [ -n "$CHECKSUM_URL" ] && [ "$CHECKSUM_URL" != "null" ]; then
                echo "找到 checksum 文件: $CHECKSUM_URL"
                curl -fsSL -o checksum_file "$CHECKSUM_URL"
                
                # 验证格式并对比
                remote_sha256=$(awk '{print $1}' checksum_file)
                echo "Remote SHA256: $remote_sha256"
                
                if [ "$remote_sha256" = "$local_sha256" ]; then
                  echo "SHA256 verified from Release checksum file!"
                  xz_check_passed="true"
                else
                  echo "SHA256 mismatch between local and remote!"
                  echo "Expected: $remote_sha256"
                  echo "Actual:   $local_sha256"
                  exit 1
                fi
              else
                # 方法 B: 查找名称包含 'sha' 或 'checksum' 的文件，然后搜索对应的文件
                echo "未找到精确匹配的 checksum 文件"
                echo "查找名称模式相关的 checksum 文件..."
                
                CHECKSUM_FILES=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("sha|checksum|sum")) | .name')
                if [ -z "$CHECKSUM_FILES" ]; then
                  echo "Release 中未找到任何 checksum 文件"
                else
                  echo "Release 中的 checksum 文件:"
                  echo "$CHECKSUM_FILES"
                  echo "由于 Armbian 不提供单个文件的 checksum，跳过远程验证"
                fi
              fi
            fi
          fi

          echo "::endgroup::"
          
          echo "::group::解压镜像..."
          xz -d *.img.xz

          mkdir -p output/images
          mv *.img output/images
          ls -la output/images/*.img
          echo "::endgroup::"

      - name: Download and unpack the latest u-boot
        run: |
          echo "::group::Download"
          echo "https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}"
          curl -L -o ./uboot.img https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}
          echo "::endgroup::"

          echo "::group::Unpack"
          mkdir -p burn
          ./AmlImg unpack ./uboot.img burn/
          echo "::endgroup::"

      - name: Extract boot and rootfs partitions
        run: |
          diskimg=$(find output/images -name "*.img" | head -n 1)
          echo "disk image: $diskimg"
          loop=$(sudo losetup --find --show --partscan $diskimg)
          sudo img2simg ${loop}p1 burn/boot.simg
          sudo img2simg ${loop}p2 burn/rootfs.simg
          sudo losetup -d $loop
          sudo chown $(id -u):$(id -g) -R burn/

      - name: Generate burn image
        run: |
          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" >burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" >burn/rootfs.VERIFY

          cat <<EOF >>burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF

          prefix=$(find output/images -name "*.img" | head -n 1 | sed 's/\.img$//')
          burnimg=${prefix}.burn.img
          ./AmlImg pack $burnimg burn/
          
          for f in output/images/*.img; do
              case "$f" in
                  *.burn.img) continue ;;
                  *) rm -f "$f" ;;
              esac
          done

          ls -la output/images

      - name: Hash and compress images
        run: |
          set -euo pipefail
          
          # 1) 找到 Generate burn image 步骤生成的 burn image（*.burn.img）
          burn_img=$(find output/images -type f -name "*.burn.img" | head -n 1 || true)
          if [ -z "$burn_img" ]; then
            echo "ERROR: no *.burn.img found in output/images (expected from Generate burn image step)"
            ls -la output/images || true
            exit 1
          fi
          echo "Found burn image: $burn_img"
          
          # 2) 计算 sha256 并压缩为 .xz（xz 默认替换原文件 -> 得到 *.burn.img.xz）
          sha256sum "$burn_img" | tee -a sha256sum
          xz --threads=0 --compress "$burn_img"
          burn_xz="${burn_img}.xz"
          if [ ! -f "$burn_xz" ]; then
            echo "ERROR: expected compressed file $burn_xz not found"
            ls -la output/images || true
            exit 1
          fi
          echo "Compressed -> $burn_xz"
          
          # 3) 推导描述文件 URL 并下载为原始的 *.img.txt 名称
          IMAGE_URL="${{ github.event.inputs.image_url }}"
          # 默认推导: *.img.xz -> *.img.txt
          if [[ "$IMAGE_URL" =~ \.img\.xz$ ]]; then
            TXT_URL="${IMAGE_URL%.img.xz}.img.txt"
            # 保持原始的 .img.txt 文件名
            descr_name="$(basename "$IMAGE_URL" .img.xz).img.txt"
          else
            TXT_URL="${IMAGE_URL}.img.txt"
            descr_name="$(basename "$IMAGE_URL").txt"
          fi
          
          echo "Trying to download description: $TXT_URL"
          descr_path="output/images/${descr_name}"
          if curl -fsSL -o "$descr_path" "$TXT_URL" 2>/dev/null; then
            echo "Description downloaded: $descr_path"
          else
            echo "Warning: description not found at $TXT_URL"
            rm -f "$descr_path" || true
          fi
          
          # 4) 清理 output/images，只保留 .burn.img.xz 和对应的 .txt（以及可选的 sha256sum）
          cd output/images
          keep1="$(basename "$burn_xz")"
          keep_files=("$keep1" "sha256sum")
          
          # Add description file to keep list if it exists
          if [ -f "$descr_name" ]; then
            keep_files+=("$descr_name")
          fi
          
          for f in *; do
            should_keep=false
            for keep in "${keep_files[@]}"; do
              if [ "$f" = "$keep" ]; then
                should_keep=true
                break
              fi
            done
            if [ "$should_keep" = false ]; then
              rm -f "$f"
            fi
          done
          echo "Final files in output/images:"
          
          ls -la
          cd - >/dev/null || true
          
          # export IMAGENAME for later steps (use the compressed filename)
          echo "IMAGENAME=$(basename "$burn_xz")" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.IMAGENAME }}-${{ env.TAG }}
          path: output/images/*

      - name: Generate release informations
        run: |
          cat <<EOF | sed -E 's/^  //' | tee Release.md
            ## 镜像信息
            
            $(cat sha256sum | awk '{printf "- **%s**: `%s`\n", $2, $1}')
            
            ## 验证方法
            
            \`\`\`bash
            sha256sum -c sha256sum
            \`\`\`
          EOF

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.IMAGENAME }}
          append_body: true
          body_path: Release.md
          files: |
            output/images/*
